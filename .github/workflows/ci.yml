name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        shell: bash
        run: pip install -r dev-requirements.txt
      - name: Run pre-commit hooks
        shell: bash
        run: pre-commit run --all-files
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          cache: true
      - name: Run MATLAB unit tests
        uses: matlab-actions/run-tests@v3
        with:
          select-by-tag: Unit
          code-coverage-cobertura: coverage.xml
          generate-summary: true
  package:
    name: Build toolbox
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          cache: true
      - name: Package and test the toolbox
        uses: matlab-actions/run-build@v2
        with:
          tasks: package
      - name: Upload toolbox
        uses: actions/upload-artifact@v4
        with:
          name: demopackage-toolbox
          path: release/demopackage.mltbx
